[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpilot"
version = "0.1.0"
description = "Multimodal Scientific Paper Analysis with Citation-Grounded QA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pymupdf==1.26.7", "pdfplumber==0.11.9", "faiss-cpu==1.13.2",
    "pydantic==2.12.5", "click==8.3.1", "rich==14.3.2", "pyyaml==6.0.3",
    "python-dotenv==1.2.1", "numpy==2.4.2", "Pillow==12.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.1"]
api = ["openai>=1.30.0,<3"]
semantic = ["sentence-transformers>=3.0.0,<6"]

[project.scripts]
researchpilot = "researchpilot.cli:main"
researchpilot-web = "researchpilot.web:main"

[tool.setuptools.package-data]
researchpilot = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests requiring API access",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
