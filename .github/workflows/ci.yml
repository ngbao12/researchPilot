name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install -e '.[dev,api]'
      - name: Lint
        run: ruff check src scripts tests
      - name: Test
        run: pytest -q
      - name: Check browser scripts
        run: |
          node --check src/researchpilot/web_assets/app.js
          node --check src/researchpilot/web_assets/i18n.js
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
